<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
<script src="main.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--surface:#0f1520;--surface2:#161d2e;--surface3:#1e2840;
  --border:#1e2840;--border2:#253350;
  --text:#e2e8f0;--text-muted:#4a5568;--text-dim:#8892a4;
  --accent:#f59e0b;--accent-glow:rgba(245,158,11,0.15);--accent-dim:rgba(245,158,11,0.08);
  --amber:#f59e0b;--danger:#ef4444;--safe:#10b981;--warning:#f97316;
  --radius:8px;--radius-lg:12px;
  --font:'Space Grotesk',sans-serif;--body:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;--surface3:#f1f5f9;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text-muted:#64748b;--text-dim:#475569;
  --accent:#d97706;--accent-glow:rgba(217,119,6,0.1);--accent-dim:rgba(217,119,6,0.06);
  --amber:#d97706;--danger:#dc2626;--safe:#059669;--warning:#ea580c;
}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:var(--font);background:none;border:none;color:inherit;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<style>
@media print {
  header button, .tweaks-panel { display: none !important; }
}
</style>
</body>
</html>
